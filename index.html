<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
    <title>Name Picker</title>
  </head>
  <body class="min-h-screen flex flex-col">
    <header>
      <div class="navbar bg-base-100 shadow-sm bg-[#284B63]">
        <div class="flex-1 text-center">
          <p class="text-2xl text-white font-bold">NamePicker</p>
        </div>
      </div>
    </header>
    <main class="flex flex-1 justify-center items-center m-10 gap-10 flex-wrap">
      <section>
        <fieldset
          class="fieldset bg-base-200 border-base-300 rounded-box w-sm border p-6 bg-[#D4D2D5]"
        >
          <legend class="fieldset-legend text-2xl font-bold">
            Choose your username
          </legend>

          <label class="label text-xl">User Name</label>
          <input
            type="text"
            class="input"
            placeholder="Write your username"
            id="input"
          />
          <p class="font-semibold text-md" id="name-feedback"></p>
          <button
            class="btn btn-neutral mt-4 bg-[#284B63] text-lg"
            id="save-btn"
          >
            Save
          </button>

          <div class="flex flex-col my-4">
            <p class="label text-xl">Don't know any name?</p>
            <button
              class="btn btn-neutral mt-4 bg-[#284B63] text-lg"
              id="generate-btn"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1em"
                height="1em"
                viewBox="0 0 16 16"
              >
                <path d="M0 0h16v16H0z" fill="none" />
                <path
                  fill="currentColor"
                  d="M7.657 6.247c.11-.33.576-.33.686 0l.645 1.937a2.89 2.89 0 0 0 1.829 1.828l1.936.645c.33.11.33.576 0 .686l-1.937.645a2.89 2.89 0 0 0-1.828 1.829l-.645 1.936a.361.361 0 0 1-.686 0l-.645-1.937a2.89 2.89 0 0 0-1.828-1.828l-1.937-.645a.361.361 0 0 1 0-.686l1.937-.645a2.89 2.89 0 0 0 1.828-1.828zM3.794 1.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387A1.73 1.73 0 0 0 4.593 5.69l-.387 1.162a.217.217 0 0 1-.412 0L3.407 5.69A1.73 1.73 0 0 0 2.31 4.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387A1.73 1.73 0 0 0 3.407 2.31zM10.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732L9.1 2.137a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"
                />
              </svg>
              Generate
            </button>
          </div>
        </fieldset>
      </section>
      <section>
        <fieldset
          class="fieldset bg-base-200 border-base-300 rounded-box w-sm border p-6 bg-[#D4D2D5]"
        >
          <legend class="fieldset-legend text-2xl font-bold">
            Enrolled Users
          </legend>
          <ol class="text-lg flex flex-col gap-2"></ol>
        </fieldset>
      </section>
    </main>

    <footer
      class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4 bg-[#284B63] text-white"
    >
      <aside>
        <p>Copyright © 2026 - All right reserved by Name Picker</p>
      </aside>
    </footer>
  </body>
</html>
